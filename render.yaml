services:
  - type: web
    name: digital-saathi
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: digital-saathi-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD_HASH
        sync: false

databases:
  - name: digital-saathi-db
    databaseName: digital_saathi
    user: digital_saathi
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: "17"
    diskSizeGB: 1
